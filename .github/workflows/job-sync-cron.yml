name: Background Job & Exam Sync Cron

on:
  schedule:
    # Run every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  sync:
    name: Sync Live Jobs & Govt Deadlines
    runs-on: ubuntu-latest
    steps:
      - name: Ping Govt Exams Sync
        run: |
          echo "Syncing government examination dates & gazette deadlines..."
          RESPONSE=$(curl -sL -w "\n%{http_code}" https://www.nichehire.tech/api/govt-exams/sync)
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          echo "HTTP Status: $HTTP_CODE"
          echo "Response: $BODY"

      - name: Ping Background Job Feed Sync
        run: |
          echo "Auditing live private job providers & feeds..."
          RESPONSE=$(curl -sL -w "\n%{http_code}" https://www.nichehire.tech/api/jobs/sync)
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          echo "HTTP Status: $HTTP_CODE"
          echo "Response: $BODY"

      - name: Trigger Zyte Scrapy Cloud Spider
        run: |
          echo "Triggering cloud spider career_portals on Zyte Scrapy Cloud..."
          RESPONSE=$(curl -s -u "${{ secrets.ZYTE_SCRAPY_KEY || '31d08cad20114510b15bac0c1e1439ca' }}:" \
            https://app.zyte.com/api/run.json \
            -d project=880275 \
            -d spider=career_portals)
          echo "Zyte Response: $RESPONSE"
